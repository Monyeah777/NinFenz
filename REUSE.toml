# REUSE 3.x declarations for NinFenz.
# Code and tooling: AGPL-3.0-only or commercial.
# Protocol/documentation text: CC-BY-4.0.
# Community submissions retain the submitter's terms.
version = 1
SPDX-PackageName = "NinFenz"
SPDX-PackageSupplier = "Monyeah777"
SPDX-PackageDownloadLocation = "https://github.com/Monyeah777/NinFenz"

[[annotations]]
path = ["**/*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Monyeah777"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["library/NF-*.md", "library/anchors/**", "community/**"]
precedence = "override"
SPDX-FileCopyrightText = "投稿人（见文件头 author / sources）"
SPDX-License-Identifier = "LicenseRef-Community-Submission"

[[annotations]]
path = ["01_核心协议.md", "02_联动注册表.md", "03_管线库/**", "04_模块库/**",
        "05_资产库/**", "06_Agent执行协议.md", "07_*.md", "protocol/**", "docs/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Monyeah777"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["LICENSE", "LICENSES/AGPL-3.0-only.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Free Software Foundation, Inc."
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["LICENSING.md", "DUAL-LICENSING-NOTICE.md", "LICENSE-EXCEPTIONS.md",
        "TRADEMARK.md", "CLA.md", "LICENSES/CC-BY-4.0.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Monyeah777"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["COMMERCIAL.md", "LICENSES/LicenseRef-Commercial.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Monyeah777"
SPDX-License-Identifier = "LicenseRef-Commercial"

[[annotations]]
path = ["MIT-NOTICE.md", "LICENSES/MIT.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Monyeah777"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["engine/rust/vendor/**"]
precedence = "override"
SPDX-FileCopyrightText = "RustPython Team and contributors; local modifications 2026 Monyeah777"
SPDX-License-Identifier = "MIT"
