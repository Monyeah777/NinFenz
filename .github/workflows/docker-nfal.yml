name: docker-nfal
# NFA-L 镜像的零成本云端构建面（本机无容器引擎时的构建出口）。
# 只 build + 冒烟，不推注册表 —— 不引入额外凭据面。
# 构建上下文 = 仓库根（packaging/nfal/Dockerfile 里 COPY desktop/src 是根相对路径）。
# PR 面（2026-11-09 补）：此前只在 main push 跑——镜像构建坏掉要等合并后才发现；
# 本 job 实测 13–45 s，故对同样的 paths 加 pull_request 触发（非 required）。
on:
  push:
    branches: [main]
    paths: &image_paths
      - 'packaging/nfal/**'
      - 'packaging/hf-space/**'
      - 'desktop/src/core/nf_expr.py'
      - 'desktop/src/core/nfal.py'
      - 'desktop/src/core/nfal_cli.py'
      - '.github/workflows/docker-nfal.yml'
  pull_request:
    paths: *image_paths
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build:
    name: build-nfal-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: 构建镜像（上下文=仓库根）
        run: docker build -f packaging/nfal/Dockerfile -t nfal:ci .
      - name: 冒烟：容器内入口可跑（--help）
        run: docker run --rm nfal:ci --help

  # 2026-11-09 补（盲区）：packaging/hf-space/Dockerfile（含 2026-11-09 的基座 digest 钉死）
  # 此前**没有任何 CI 构建面**——坏掉只能等发布时发现。补 build + 导入冒烟。
  # 构建上下文 = packaging/hf-space（Dockerfile 里 COPY server.py 是该目录相对路径；npm payload 阶段走网络）。
  build-hf-space:
    name: build-hf-space-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: 构建镜像（上下文=packaging/hf-space）
        run: docker build -f packaging/hf-space/Dockerfile -t nf-hf-space:ci packaging/hf-space
      - name: 冒烟：server.py 在容器内可导入（纯标准库、不启动服务）
        run: docker run --rm -w /app nf-hf-space:ci python -c "import server; print('hf-space server.py import ok')"
      - name: 失败诊断产物（Z5）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: docker-hf-space-diagnostics
          path: |
            .nf-logs/
            .artifacts/
            *.log
          if-no-files-found: ignore

      - name: 失败诊断产物（Z5：本 run 的日志/报告；无则跳过）
        # Z5（2026-10-10 审计 §11j N8）：失败时要有**可下载**的诊断物，而不是只留滚动日志。
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: docker-nfal-diagnostics
          path: |
            .nf-logs/
            .artifacts/
            *.log
          if-no-files-found: ignore
