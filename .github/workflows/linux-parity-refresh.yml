name: linux-parity-refresh
# 跨平台基线刷新器（只读）：把「只能在 Linux 上得到的量」产出成工件，
# 供维护者据此更新 protocol/sast_baseline.json 的 posix 段 / 定位向量跨平台差异。
# 触发：workflow_dispatch（手动）+ 每周一次定时（作为**跨平台漂移告警**）；
# 不写仓库、不推送，只上传工件。
# 2026-11-08 起：定时跑时若 `vectors.diff`/`projections.diff` 非空、或 posix SAST 计数
# 与 `protocol/sast_baseline.json` 不符 → 红（此前只在人工跑时看输出，漂移没有 CI 告警）。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'        # 每周一 06:00 UTC：跨平台一致性回归


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    name: linux-parity-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-*.txt
      - name: 安装固定版本工具（lint/sast）
        run: |
          pip install --require-hashes -r .github/requirements-ci.txt
          pip install --require-hashes -r .github/requirements-lint.txt -r .github/requirements-sast.txt
      - name: posix SAST 计数（基线维护输入）
        run: |
          python scripts/sast_check.py --json --platform posix > sast-posix.json || true
          python - <<'PY'
          import json
          doc = json.load(open("sast-posix.json", encoding="utf-8"))
          print("bandit", sum(doc["bandit"].values()), "ruff-S", sum(doc["ruff"].values()))
          PY
      - name: 证据向量 Linux 重算（跨平台差异定位）
        run: |
          python scripts/evidence_vectors.py --write
          git diff -- results/ccos/evidence_verdict_vectors.json > vectors.diff || true
          wc -l vectors.diff
          head -c 4000 vectors.diff || true
      - name: 投影件 Linux 重算（平台无关性验证）
        run: |
          python scripts/nf.py layers --write
          python scripts/verify_report.py --write
          git diff -- protocol/role_coordinates.json protocol/verification_report.json \
            docs/layers.md > projections.diff || true
          wc -l projections.diff
          head -c 4000 projections.diff || true
      - name: 跨平台漂移判定（非空 diff / posix 计数与基线不符 → 红）
        run: |
          rc=0
          for f in vectors.diff projections.diff; do
            if [ -s "$f" ]; then
              echo "::error::$f 非空：Linux 与本机生成物不一致（见工件 diff）"
              rc=1
            fi
          done
          python - <<'PY'
          import json
          cur = json.load(open("sast-posix.json", encoding="utf-8"))
          base = json.load(open("protocol/sast_baseline.json", encoding="utf-8"))["platforms"]["posix"]
          got = (sum(cur["bandit"].values()), sum(cur["ruff"].values()))
          want = (sum(base["bandit"].values()), sum(base["ruff"].values()))
          print("posix SAST：实测", got, "基线", want)
          if got != want:
              print("::error::posix SAST 计数与基线不一致（工具版本/平台漂移）")
              raise SystemExit(1)
          PY
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: linux-parity
          path: |
            sast-posix.json
            vectors.diff
            projections.diff
          if-no-files-found: warn
