name: linux-parity-refresh
# 跨平台基线刷新器（只读）：把「只能在 Linux 上得到的量」产出成工件，
# 供维护者据此更新 protocol/sast_baseline.json 的 posix 段 / 定位向量跨平台差异。
# 触发：workflow_dispatch（默认分支上手动跑）；不写仓库、不推送，只上传工件。
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    name: linux-parity-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-*.txt
      - name: 安装固定版本工具（lint/sast）
        run: |
          pip install -r .github/requirements-ci.txt
          pip install -r .github/requirements-lint.txt -r .github/requirements-sast.txt
      - name: posix SAST 计数（基线维护输入）
        run: |
          python scripts/sast_check.py --json --platform posix > sast-posix.json || true
          python - <<'PY'
          import json
          doc = json.load(open("sast-posix.json", encoding="utf-8"))
          print("bandit", sum(doc["bandit"].values()), "ruff-S", sum(doc["ruff"].values()))
          PY
      - name: 证据向量 Linux 重算（跨平台差异定位）
        run: |
          python scripts/evidence_vectors.py --write
          git diff -- results/ccos/evidence_verdict_vectors.json > vectors.diff || true
          wc -l vectors.diff
          head -c 4000 vectors.diff || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: linux-parity
          path: |
            sast-posix.json
            vectors.diff
          if-no-files-found: warn
