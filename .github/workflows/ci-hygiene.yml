name: ci-hygiene
# CI-02 / CI-03 / CI-08 / FX-14 / FX-15 接线：
#   format          —— pre-commit run --all-files（配置 .pre-commit-config.yaml；不许 continue-on-error）
#   markdownlint    —— 单一执行入口 scripts/check_markdown_structure.sh（规则 .markdownlint.json：
#                      MD001/MD009/MD025/MD041/MD047 生效、MD013 显式关闭；扫描面与排除理由见该脚本）
#   lockfile-purity —— CI-08：pip 固定清单安装后工作树必须干净；npm 侧无锁文件则不引 npm ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: pre-commit-all-files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          cache: pip
          cache-dependency-path: .github/requirements-*.txt
          python-version: '3.11'
      - name: 缓存 pre-commit 钩子环境（key 含配置内容 hash，配置变即失效）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: 安装固定版本门禁工具（pre-commit 已钉在 requirements-ci.txt）
        run: pip install -r .github/requirements-ci.txt
      - name: 全量格式检查（未过即红；不得 continue-on-error）
        run: pre-commit run --all-files --show-diff-on-failure

  markdownlint:
    name: markdownlint-md-structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20.19.0'
      - name: 缓存 npx 下载缓存（key 含固定版本号）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.npm
          key: npm-markdownlint-cli2-0.23.3-${{ runner.os }}
      - name: 结构规则检查（本地与 CI 同一条命令）
        run: bash scripts/check_markdown_structure.sh

  lockfile-purity:
    name: lockfile-purity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          cache: pip
          cache-dependency-path: .github/requirements-*.txt
          python-version: '3.11'
      - name: 安装依赖（固定清单；若清单带 --hash 则进入 hash-checking 模式）
        run: pip install -r .github/requirements-ci.txt
      - name: Python 侧锁文件纯净断言（安装不得改写受跟踪文件）
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error::依赖安装步骤改写了受跟踪文件（requirements/锁文件纯净判据）"
            printf '%s\n' "$dirty"
            exit 1
          fi
          echo "通过：依赖安装后工作树干净"
      - name: npm 侧锁文件判据（本仓无 package-lock.json ⇒ 不引 npm ci；禁止项目依赖 npm install）
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch packaging/npm/package-lock.json >/dev/null 2>&1; then
            echo "::error::packaging/npm 出现 package-lock.json —— 发布链路必须改用 npm ci 并同步本判据"
            exit 1
          fi
          offenders="$(grep -rn 'npm install' .github/workflows/ | grep -v 'npm install -g' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::workflow 出现项目依赖 npm install（锁文件不可复现）"
            printf '%s\n' "$offenders"
            exit 1
          fi
          echo "通过：无 package-lock.json 且无项目依赖 npm install"
