name: dependency-audit
# 依赖面审计（渗透收口 F-05 余项 · 2026-09-24）
#
# 定位与本仓既有 external-links 同构：**不进 verify 基线**（门禁须静态可复现、零外网依赖），
# 而把依赖审计做成独立任务——每周 + 手动触发 + push 到 main 时跑，任一已知漏洞即红。
#
# 为什么需要它：CI 工具链此前是无版本 `pip install`，依赖面**没有任何可审对象**；
# 现在版本固定在 .github/requirements-ci.txt，本工作流即对该固定集做 CVE 审计。
# 注意：审计的是 **CI 工具链版本集**，不是 NF 本体的运行时依赖（NF 本体纯标准库 + 软导入）。
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'      # 每周一 03:23 UTC（与 external-links 错开）

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit-pinned-ci-toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          cache-dependency-path: .github/requirements-*.txt
          cache: pip
          python-version: '3.11'
      - name: 安装审计器（版本固定，见 .github/requirements-audit.txt）
        run: pip install -r .github/requirements-audit.txt
      - name: 对固定依赖集做 CVE 审计（命中即红）
        run: python -m pip_audit -r .github/requirements-ci.txt --progress-spinner off

      - name: 失败诊断产物（Z5：本 run 的日志/报告；无则跳过）
        # Z5（2026-10-10 审计 §11j N8）：失败时要有**可下载**的诊断物，而不是只留滚动日志。
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dependency-audit-diagnostics
          path: |
            .nf-logs/
            .artifacts/
            *.log
          if-no-files-found: ignore
