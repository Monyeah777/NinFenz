name: dependency-audit
# 依赖面审计（渗透收口 F-05 余项 · 2026-09-24）
#
# 定位与本仓既有 external-links 同构：**不进 verify 基线**（门禁须静态可复现、零外网依赖），
# 而把依赖审计做成独立任务——每周 + 手动触发 + push 到 main 时跑，任一已知漏洞即红。
#
# 为什么需要它：CI 工具链此前是无版本 `pip install`，依赖面**没有任何可审对象**；
# 现在版本固定在 .github/requirements-*.txt，本工作流即对**全部四份固定集**做 CVE 审计
# （ci/lint/sast/audit——此前只审 requirements-ci.txt，lint/sast/audit 的漏洞只能靠人工那次审计）。
# 注意：审计的是 **CI 工具链版本集**，不是 NF 本体的运行时依赖（NF 本体纯标准库 + 软导入）。
#
# PR 面（2026-11-09 补）：requirements 改动在 PR 上就跑审计（job 实测 24–29 s），不用等合并后；
# 仍非 required。工作流口径（权限/固定/四集覆盖/fail-closed/审计日志可下载）由
# desktop/tests/test_dependency_audit_workflow_contract.py 判据守住。
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/requirements-*.txt'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'      # 每周一 03:23 UTC（与 external-links 错开）

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit-pinned-ci-toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          cache-dependency-path: .github/requirements-*.txt
          cache: pip
          python-version: '3.11'
      - name: 安装审计器（版本固定，见 .github/requirements-audit.txt）
        run: pip install --require-hashes -r .github/requirements-audit.txt
      - name: 对四份固定依赖集做 CVE 审计（命中即红；输出落盘供失败诊断）
        run: |
          set -euo pipefail
          set -o pipefail   # 显式写法：test_ci_diagnostics 的 tee 守卫按此字面检查（与上句语义重复，但契约要求）
          # 审计输出 tee 到工件：失败时"哪个包/哪条漏洞"必须可下载，而不是只在滚动日志里。
          python -m pip_audit --progress-spinner off \
            -r .github/requirements-ci.txt \
            -r .github/requirements-lint.txt \
            -r .github/requirements-sast.txt \
            -r .github/requirements-audit.txt 2>&1 | tee dependency-audit.log

      - name: 失败诊断产物（Z5：本 run 的日志/报告；无则跳过）
        # Z5（2026-10-10 审计 §11j N8）：失败时要有**可下载**的诊断物，而不是只留滚动日志。
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dependency-audit-diagnostics
          path: |
            .nf-logs/
            .artifacts/
            *.log
            dependency-audit.log
          if-no-files-found: ignore
          retention-days: 7    # 排障工件，7 天回收
