name: docs-links
# DC-06 链接巡检（内链 fail / 外链 warn 的分工）：
#   内链（仓内相对链接 404）→ 本工作流，**必过**；外链可达性 → external-links.yml（定时，仅告警）。
#   存量欠账在 scripts/internal_link_baseline.json 逐条登记；新增死链直接红。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  internal-links:
    name: internal-links-404-fail
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: 内链检查（全部 md；内链 404 即失败）
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python scripts/check_internal_links.py --json --report .artifacts/internal-links.json \
            2>&1 | tee .artifacts/internal-links.log
      - name: 上传巡检报告（失败时同样上传）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: internal-links-report
          path: |
            .artifacts/internal-links.json
            .artifacts/internal-links.log
          if-no-files-found: warn
