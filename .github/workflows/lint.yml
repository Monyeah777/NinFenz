name: lint
# 41 波C D3：ruff 语法级静态检查（独立 job，不碰 verify.sh 零依赖红线——
# verify 用纯 unittest/stdlib；本 job 仅 CI 环境装 ruff）。
on:
  push:
    branches: [main]
  # D2 同源（2026-10-10 审计）：风格门也要管未合并 PR；限目标 main（其余分支不消耗 runner）。
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff-syntax:
    name: ruff-check-e9-f63-f7-f82
    runs-on: ubuntu-latest
    timeout-minutes: 15          # 挂死上限（2026-10-01 统一）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          cache-dependency-path: .github/requirements-*.txt
          cache: pip
          python-version: '3.11'
      - name: 安装 ruff
        run: pip install --require-hashes -r .github/requirements-lint.txt  # 版本固定见该文件（F-05）
      - name: ruff 语法级静态检查（ruff.toml：E9/F63/F7/F82；github 输出=行内注释）
        run: ruff check --output-format=github desktop/src scripts

  style-ratchet:
    name: ruff-style-ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20          # 挂死上限（2026-10-01 统一）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          cache-dependency-path: .github/requirements-*.txt
          cache: pip
          python-version: '3.11'
      - name: 安装 ruff
        run: pip install --require-hashes -r .github/requirements-lint.txt  # 版本固定见该文件（F-05）
      - name: 风格计数快照（诊断用；**判定**由下一步棘轮执行，此处吞错只为留存计数）
        run: |
          python scripts/style_check.py --json > style-counts.json || true
      - name: 风格棘轮（Z2：规则集 E,W,F,B,UP,I,C4,SIM,RET，只拦新增；存量按基线冻结）
        run: python scripts/style_check.py

      - name: 失败诊断产物（Z5：本 run 的日志/报告；无则跳过）
        # Z5（2026-10-10 审计 §11j N8）：失败时要有**可下载**的诊断物，而不是只留滚动日志。
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: lint-diagnostics
          path: |
            .nf-logs/
            .artifacts/
            *.log
            style-counts.json
          if-no-files-found: ignore
          retention-days: 7    # 排障工件，7 天回收（存储卫生）
