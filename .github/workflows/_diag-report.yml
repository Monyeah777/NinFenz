name: _diag-report-nondeterminism

# 一次性诊断（用完即删）：**复刻 unit-tests 分片环境**（same requirements-ci.txt），
# 在 ubuntu 上连跑两次 verify_report.build()，并逐 item 与已提交报告对拍。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          cache-dependency-path: .github/requirements-*.txt
          cache: pip
          python-version: '3.11'
      - name: 与分片作业同口径装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
          pip install -r .github/requirements-ci.txt
          mkdir -p .gitee/ISSUE_TEMPLATE engine/dotnet/dist engine/rust/canonical/target
      - name: 两次构建 + 与提交件逐 item 对拍
        env:
          NF_VERIFY_TMP: .nf-logs
        run: |
          set -u
          cd desktop
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "src")
          from core import verify_report as vr

          a = vr.build("..")
          b = vr.build("..")
          c = json.load(open("../protocol/verification_report.json", encoding="utf-8"))
          print("ROOT live_a", a["root_digest"][:16])
          print("ROOT live_b", b["root_digest"][:16])
          print("ROOT committed", c["root_digest"][:16])
          print("a==b", a == b, " a==committed", a == c)
          for x, y in zip(c["items"], a["items"]):
              if x != y:
                  print("=== DIFF:", x["id"])
                  print("  committed:", json.dumps(x, ensure_ascii=False, sort_keys=True)[:500])
                  print("  live     :", json.dumps(y, ensure_ascii=False, sort_keys=True)[:500])
          if c.get("declared") != a.get("declared"):
              for k in sorted(set(c.get("declared") or {}) | set(a.get("declared") or {})):
                  if (c.get("declared") or {}).get(k) != (a.get("declared") or {}).get(k):
                      print("  declared[%s]: committed=%r live=%r" % (
                          k, (c.get("declared") or {}).get(k), (a.get("declared") or {}).get(k)))
          if c.get("summary") != a.get("summary"):
              print("  summary: committed=%r live=%r" % (c.get("summary"), a.get("summary")))
          PY
