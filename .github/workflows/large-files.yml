name: large-files
# CI-04 大文件拦截（独立 workflow）：
#   只看**提交内容**（索引 / 本次 diff 范围里的 blob），不看工作区——工作区检查永远看不见历史。
#   阈值默认 1 MiB，由 scripts/check_added_large_files.py 实现；超过即红。
#   历史里已存在的大文件不在本工作流拦截面内（只能向前拦截），体积现状由 repo-health 体检记录。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  added-large-files:
    name: added-large-files-le-1MiB
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: 计算 diff 范围（PR 用 base...head；push 用 before..head；手动触发查 HEAD 提交）
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}...${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=" >> "$GITHUB_OUTPUT"
          fi
      - name: 大文件拦截（提交内容，阈值 1 MiB；脚本自证见 evidence）
        run: |
          set -euo pipefail
          if [ -n "${{ steps.range.outputs.range }}" ]; then
            python scripts/check_added_large_files.py --range "${{ steps.range.outputs.range }}"
          else
            python scripts/check_added_large_files.py
          fi
