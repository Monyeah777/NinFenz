name: sast
# 静态安全扫描门禁（ISO 25010 安全性 / 供应链面 · 2026-09-29）
#
# 为什么单独一条：`purity_scan` 只覆盖**动态执行/反序列化/递归删除**这一类危险 sink，
# 而 SQL 拼接、弱随机、XXE、不含超时的请求等 AI 代码高频缺陷不在其中。本 job 跑
# bandit + ruff `--select S`，并按 (工具,文件,规则) **计数棘轮**判：
# 计数上升或出现新 (文件,规则) → 红；计数下降 → 提示重冻（债务只许减）。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sast-baseline:
    name: bandit+ruff-s-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          cache-dependency-path: .github/requirements-*.txt
          cache: pip
          python-version: '3.11'
      - name: 安装 SAST 工具（版本固定）
        run: |
          pip install -r .github/requirements-sast.txt
          pip install -r .github/requirements-lint.txt
      - name: SAST 计数棘轮（新增/上升即红）
        run: |
          python scripts/sast_check.py --json > .sast-counts.json || true
          python - <<'PY'
          import json
          doc = json.load(open(".sast-counts.json", encoding="utf-8"))
          print("本平台计数：bandit %d · ruff-S %d"
                % (sum(doc["bandit"].values()), sum(doc["ruff"].values())))
          PY
          python scripts/sast_check.py 2>&1 | tee sast.log

      - name: 失败诊断产物（Z5：本 run 的日志/报告；无则跳过）
        # Z5（2026-10-10 审计 §11j N8）：失败时要有**可下载**的诊断物，而不是只留滚动日志。
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sast-diagnostics
          path: |
            .nf-logs/
            .artifacts/
            *.log
            .sast-counts.json
          if-no-files-found: ignore
