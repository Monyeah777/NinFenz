name: sast
# 静态安全扫描门禁（ISO 25010 安全性 / 供应链面 · 2026-09-29）
#
# 为什么单独一条：`purity_scan` 只覆盖**动态执行/反序列化/递归删除**这一类危险 sink，
# 而 SQL 拼接、弱随机、XXE、不含超时的请求等 AI 代码高频缺陷不在其中。本 job 跑
# bandit + ruff `--select S`，并按 (工具,文件,规则) **计数棘轮**判：
# 计数上升或出现新 (文件,规则) → 红；计数下降 → 提示重冻（债务只许减）。
#
# PR 面（2026-11-09 补）：此前只在 main push 跑——PR 引入的新 SAST 违规要到**合并后**才暴露。
# 本 job 实测 31–40 s（固定版本工具 + 棘轮），PR 面完全跑得起；仍非 required（不阻塞），
# 但让安全违规在评审时就可见。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sast-baseline:
    name: bandit+ruff-s-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          cache-dependency-path: .github/requirements-*.txt
          cache: pip
          python-version: '3.11'
      - name: 安装 SAST 工具（版本固定）
        run: |
          pip install --require-hashes -r .github/requirements-sast.txt
          pip install --require-hashes -r .github/requirements-lint.txt
      - name: SAST 计数棘轮（新增/上升即红）
        run: |
          python scripts/sast_check.py --json > .sast-counts.json || true
          python - <<'PY'
          import json
          doc = json.load(open(".sast-counts.json", encoding="utf-8"))
          print("本平台计数：bandit %d · ruff-S %d"
                % (sum(doc["bandit"].values()), sum(doc["ruff"].values())))
          PY
          python scripts/sast_check.py 2>&1 | tee sast.log

      - name: 扩展面可见性（tui/ + packaging/；非阻塞，仅留档）
        # 2026-11-09 审计（task-40）：棘轮 SCAN_TARGETS 只有 desktop/src/scripts/.github/scripts，
        # 而 tui/（终端入口）与 packaging/（含对公网 hf-space server.py）完全没进 SAST 面。
        # 扩棘轮需按平台重测基线（本地只有 nt 段），暂先做**非阻塞可见性**：跑一遍、把 JSON 留 artifact，
        # 让后续扩展有真实数据可 review（不改 baseline、不会红）。
        if: always()
        run: |
          set +e
          python -m bandit -r tui packaging -f json -o sast-extra-bandit.json
          python -m ruff check --select S tui packaging --output-format json > sast-extra-ruff.json
          python - <<'PY'
          import json
          import pathlib
          for name in ("bandit", "ruff"):
              p = pathlib.Path("sast-extra-%s.json" % name)
              if not p.is_file():
                  continue
              try:
                  doc = json.loads(p.read_text(encoding="utf-8"))
              except ValueError:
                  print("%s 扩展面输出不可解析（留档跳过）" % name)
                  continue
              rows = doc.get("results", []) if isinstance(doc, dict) else doc
              print("%s 扩展面命中 %d 条（非阻塞；JSON 见 artifact）" % (name, len(rows)))
          PY
      - name: 失败诊断产物（Z5：本 run 的日志/报告；无则跳过）
        # Z5（2026-10-10 审计 §11j N8）：失败时要有**可下载**的诊断物，而不是只留滚动日志。
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sast-diagnostics
          path: |
            .nf-logs/
            .artifacts/
            *.log
            .sast-counts.json
            sast-extra-bandit.json
            sast-extra-ruff.json
          if-no-files-found: ignore
