name: sbom-vuln
# SC-06：依赖树无未登记/过期处置的高危漏洞；SBOM 作为制品归档。
on:
  push:
    branches: [main]
    paths:
      - '.github/requirements-*.txt'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'scripts/vuln_disposition.py'
      - '.github/workflows/sbom-vuln.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: sbom-vuln-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom:
    name: sbom-cyclonedx
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          cache: pip
          cache-dependency-path: .github/requirements-*.txt
          python-version: '3.11'
      - name: 生成 CycloneDX SBOM
        run: |
          set -euo pipefail
          pip install cyclonedx-bom
          cyclonedx-py requirements .github/requirements-ci.txt -o sbom.cdx.json
          ls -l sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  vuln:
    name: vuln-disposition
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          cache: pip
          cache-dependency-path: .github/requirements-*.txt
          python-version: '3.11'
      - name: pip-audit 取漏洞树
        run: |
          set -euo pipefail
          pip install pip-audit
          pip-audit -r .github/requirements-ci.txt -f json -o audit.json || true
          test -s audit.json
      - name: 处置核对（高危/严重必须有 reason 与 review_by）
        run: python scripts/vuln_disposition.py --audit audit.json
