name: npm-publish
# 发 npm 包（v* tag 或手动触发）。来源证明（provenance）由 OIDC 签发，与 package.json 的
# publishConfig.provenance=true 同源；优先走 npm trusted publishing（无 token），有 NPM_TOKEN 时回退 token。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write          # provenance / trusted publishing 必需
jobs:
  publish:
    name: npm-publish-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: tag 与包版本一致性（D3：v* tag 与 npm 版本不同源 ⇒ 不许静默空转）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(node -p "require('./packaging/npm/package.json').version")
          TAG="${{ github.ref_name }}"
          if [ "$TAG" != "v$V" ]; then
            echo "::error::tag=$TAG 与 npm 包版本 v$V 不一致（本仓 tag 走 v2.x 协议线、包走 1.0.x）——请用 v$V 打 tag，或先 bump 包版本"
            exit 1
          fi
          echo "tag=$TAG 与包版本 v$V 一致"
      - name: 工具链自述 + 把 npm 升到支持 trusted publishing 的版本
        run: |
          node --version
          npm --version
          # npm trusted publishing（OIDC，免令牌）要求 npm >= 11.5.1；runner 自带的 10.x 不够。
          # 2026-10-08 实证：带发布权的 bypass-2FA 令牌正在被 npm 弃用（2027-01 取消），令牌路线不可持续，
          # 故本作业改为纯 OIDC 发布；NPM_TOKEN secret 一旦删除即自动走 OIDC 分支。
          npm install -g npm@latest
          npm --version
          # CI-08 说明（本仓口径）：packaging/npm 没有 package-lock.json，package.json 不含 dependencies，
          # 发布链路**不安装项目依赖**——唯一一处 npm install 是上面这条 -g 工具链自举，
          # 它只写全局前缀、不写仓库锁文件。所以这里不用 npm ci（无锁文件可用），
          # 改为在 npm 步骤跑完后断言「packaging/npm 下受跟踪文件未被改写」（见下方锁文件纯净步骤）。
      - name: payload 暂存 + 发布前自检 + 冒烟
        working-directory: packaging/npm
        run: |
          npm run stage
          npm run verify
          node --test test/smoke.test.mjs
      - name: 打包并核对体积（tarball 体积是发布质量的一部分）
        working-directory: packaging/npm
        run: npm pack --dry-run
      - name: 打包产物逐字节核对（A3：tarball 与 payload 清单，补上最后一跳判据）
        working-directory: packaging/npm
        run: node tools/verify-tarball.mjs
      - name: 锁文件纯净断言（CI-08：npm 步骤不得改写受跟踪文件）
        # 为什么断言而不是 npm ci：本仓 packaging/npm 无 package-lock.json、无 dependencies，
        # 发布链路本身不安装项目依赖；没有锁文件时 npm ci 会直接失败（can only install with an
        # existing package-lock.json），硬引锁文件属于另立项（见 evidence 的 amend 依据）。
        # 这里用「跑完一整串 npm 步骤后 packaging/npm 受跟踪文件零改动」钉住 CI-08 要的语义：
        # 装得上 != 装的是锁文件里那一份；不写锁文件同样要能被证明。
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=no -- packaging/npm)"
          if [ -n "$dirty" ]; then
            echo "::error::npm 步骤改写了 packaging/npm 下的受跟踪文件（锁文件纯净判据）"
            printf '%s\n' "$dirty"
            exit 1
          fi
          echo "通过：npm 链路未改写 packaging/npm 受跟踪文件（无锁文件可被改写）"
      - name: 配置 registry 认证（有 token 写 .npmrc，否则走 OIDC）
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 2026-10-07 首次运行实证：本文件此前多写了反斜杠转义 —— YAML 那一层让密钥表达式不被求值，
          # bash 那一层让变量不被展开，于是 .npmrc 里落的是字面量而不是 token，publish 必然 401/404。
          # 现在改成不转义的写法，并加一步 whoami 自检（token 坏了就当场红，不再拖到最后一步）。
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
            echo "auth=token"
            npm whoami || { echo "::error::NPM_TOKEN 无效或权限不足（whoami 失败）：建议用 Automation token，或 granular token 选 All packages: read and write"; exit 1; }
          else
            echo "auth=oidc(trusted publishing)"
          fi
      - name: 发布（带 provenance；同版本已存在即跳过 = 幂等重跑）
        working-directory: packaging/npm
        run: |
          # 幂等：重跑 workflow 时该版本已在 registry 上，再发必 409/403。跳过而不是失败——
          # "这个版本已发布" 正是重跑想要的结果（要真重发请先 bump package.json 版本）。
          V=$(node -p "require('./package.json').version")
          if npm view "ninfenz@$V" version >/dev/null 2>&1; then
            echo "::notice::ninfenz@$V 已存在于 npmjs —— 跳过发布（幂等重跑）"
          else
            npm publish --provenance --access public
          fi
          rm -f .npmrc

  publish-github-packages:
    name: npm-publish-github-packages
    # GitHub Packages 只接受 scoped 包（@owner/name），故两通道**包名不同**：
    #   npmjs.com        → ninfenz（unscoped，面向公众）
    #   GitHub Packages  → @monyeah777/ninfenz（同仓发布用 GITHUB_TOKEN，无需 PAT；scoped 名须全小写）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write          # 发布包到 GitHub Packages 必需
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: payload 暂存 + 发布前自检（先按 npmjs 口径自证，再改名）
        working-directory: packaging/npm
        run: |
          npm run stage
          npm run verify
      - name: 以 scoped 名发布到 GitHub Packages
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 顺序要紧：自检必须在改名**之前**跑完 —— verify-package.mjs 要求 publishConfig.provenance=true，
          # 而发到 GitHub Packages 的成品必须去掉它（该 registry 不收来源证明）。2026-10-07 首次运行
          # 正是栽在顺序上：先改名再 publish，prepack 回头重跑自检，自己把自己判红。
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.name='@monyeah777/ninfenz';if(p.publishConfig)delete p.publishConfig.provenance;p.publishConfig=Object.assign({},p.publishConfig,{registry:'https://npm.pkg.github.com'});fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          printf '@monyeah777:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          # 幂等同上：GitHub Packages 同一版本二次发布会 409 Conflict - Cannot publish over existing version
          V=$(node -p "require('./package.json').version")
          if npm view "@monyeah777/ninfenz@$V" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::notice::@monyeah777/ninfenz@$V 已存在于 GitHub Packages —— 跳过（幂等重跑）"
          else
            npm publish --access public --ignore-scripts
          fi
          rm -f .npmrc

      - name: 失败诊断产物（Z5：本 run 的日志/报告；无则跳过）
        # Z5（2026-10-10 审计 §11j N8）：失败时要有**可下载**的诊断物，而不是只留滚动日志。
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: npm-publish-diagnostics
          path: |
            .nf-logs/
            .artifacts/
            *.log
          if-no-files-found: ignore
