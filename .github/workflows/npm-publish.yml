name: npm-release

# One release pipeline: reproducible build -> hosted provenance -> independent
# verification/VSA -> npm and GitHub Packages publication -> GitHub Release.
# Pull requests are dry-run only; irreversible publication requires a v1.* tag
# or an explicit workflow_dispatch with publish=true.
on:
  push:
    tags: ['v1.*']
  pull_request:
    paths:
      - 'packaging/npm/**'
      - 'packaging/supply-chain/**'
      - 'protocol/product_metadata.json'
      - 'scripts/product_metadata.py'
      - 'scripts/supply_chain_policy.py'
      - 'scripts/validate_sboms.py'
      - 'scripts/generate_vex.py'
      - 'scripts/build_vsa.py'
      - '.github/workflows/npm-publish.yml'
      - '.github/requirements-sbom.txt'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifacts to npm and GitHub Packages
        required: true
        default: false
        type: boolean

concurrency:
  group: library-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: reproducible-release-artifacts
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v1.')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.10'
          registry-url: https://registry.npmjs.org
      - name: Canonical product metadata and generated surfaces
        run: python scripts/product_metadata.py --check
      - name: Install pinned SBOM validators
        run: python -m pip install -r .github/requirements-sbom.txt
      - name: Tag and package version agreement
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./packaging/npm/package.json').version")
          test "$TAG" = "v$V"
      - name: Supply-chain evidence matrix
        run: python scripts/supply_chain_policy.py
      - name: Reproducible dual build, SBOM, VEX, checksums and manifest
        env:
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          python packaging/npm/tools/build_release.py --out .artifacts/release
          python scripts/validate_sboms.py .artifacts/release
          python packaging/npm/tools/build_release.py --verify .artifacts/release
      - name: Tarball and payload manifest byte parity
        run: |
          set -euo pipefail
          V=$(node -p "require('./packaging/npm/package.json').version")
          node packaging/npm/tools/verify-tarball.mjs \
            --tarball ".artifacts/release/ninfenz-$V.tgz"
      - name: npm package self-check and smoke
        working-directory: packaging/npm
        run: |
          set -euo pipefail
          npm run verify
          node --test test/smoke.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: release-bundle
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 30

  attest:
    name: github-build-provenance
    needs: build
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-bundle
          path: .artifacts/release
      - name: Attest every release subject with hosted OIDC
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            .artifacts/release/*.tgz
            .artifacts/release/*.cdx.json
            .artifacts/release/*.spdx3.json
            .artifacts/release/*.openvex.json
            .artifacts/release/*.cdx-vex.json
            .artifacts/release/SHA256SUMS
            .artifacts/release/release-metadata.json

  verify:
    name: verify-provenance-and-sign-vsa
    needs: [build, attest]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-bundle
          path: .artifacts/release
      - name: Downloaded artifact integrity
        working-directory: .artifacts/release
        run: sha256sum -c SHA256SUMS
      - name: Verify every provenance subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(
            .artifacts/release/*.tgz
            .artifacts/release/*.cdx.json
            .artifacts/release/*.spdx3.json
            .artifacts/release/*.openvex.json
            .artifacts/release/*.cdx-vex.json
            .artifacts/release/SHA256SUMS
            .artifacts/release/release-metadata.json
          )
          test "${#FILES[@]}" -ge 12
          for FILE in "${FILES[@]}"; do
            gh attestation verify "$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/npm-publish.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --predicate-type "https://slsa.dev/provenance/v1"
          done
      - name: Generate Build L2 VSA predicate
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/supply_chain_policy.py
          python scripts/slsa_l3_readiness.py
          python scripts/build_vsa.py \
            --release-dir .artifacts/release \
            --policy packaging/supply-chain/verification-policy.json \
            --repository "$REPOSITORY_URL" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --out .artifacts/vsa/verification-summary.json
      - name: Sign VSA with GitHub OIDC
        id: vsa
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-path: |
            .artifacts/release/*.tgz
            .artifacts/release/*.cdx.json
            .artifacts/release/*.spdx3.json
            .artifacts/release/*.openvex.json
            .artifacts/release/*.cdx-vex.json
            .artifacts/release/SHA256SUMS
            .artifacts/release/release-metadata.json
          predicate-type: https://slsa.dev/verification_summary/v1
          predicate-path: .artifacts/vsa/verification-summary.json
      - name: Verify signed VSA bundle
        env:
          GH_TOKEN: ${{ github.token }}
          VSA_BUNDLE: ${{ steps.vsa.outputs.bundle-path }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for FILE in .artifacts/release/*.tgz .artifacts/release/*.cdx.json \
            .artifacts/release/*.spdx3.json .artifacts/release/*.openvex.json \
            .artifacts/release/*.cdx-vex.json \
            .artifacts/release/SHA256SUMS .artifacts/release/release-metadata.json; do
            gh attestation verify "$FILE" \
              --bundle "$VSA_BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/npm-publish.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --predicate-type "https://slsa.dev/verification_summary/v1"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: vsa-evidence
          path: |
            .artifacts/vsa/verification-summary.json
            ${{ steps.vsa.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30

  publish-npm:
    name: publish-attested-npm-artifact
    needs: [build, attest, verify]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-bundle
          path: .artifacts/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: vsa-evidence
          path: .artifacts/vsa
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.10'
          registry-url: https://registry.npmjs.org
      - name: Downloaded artifact integrity
        working-directory: .artifacts/release
        run: sha256sum -c SHA256SUMS
      - name: Reverify provenance and VSA before publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARBALL=$(find .artifacts/release -maxdepth 1 -name 'ninfenz-*.tgz' -print -quit)
          VSA_BUNDLE=$(find .artifacts/vsa -maxdepth 1 -type f \
            ! -name 'verification-summary.json' -print -quit)
          gh attestation verify "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/npm-publish.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type "https://slsa.dev/provenance/v1"
          gh attestation verify "$TARBALL" \
            --bundle "$VSA_BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/npm-publish.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type "https://slsa.dev/verification_summary/v1"
      - name: Publish verified tarball to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          npm install -g npm@12.2.2
          V=$(python3 -c "import json; print(json.load(open('.artifacts/release/release-metadata.json'))['version'])")
          TARBALL=".artifacts/release/ninfenz-$V.tgz"
          EXISTING=$(npm view "ninfenz@$V" dist.integrity 2>/dev/null || true)
          LOCAL="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          if [ -n "$EXISTING" ]; then
            test "$EXISTING" = "$LOCAL"
            echo "ninfenz@$V already exists with identical integrity"
            exit 0
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" \
              > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          fi
          npm publish "$TARBALL" --provenance --access public --ignore-scripts

  publish-github-packages:
    name: publish-attested-github-packages-mirror
    needs: [build, attest, verify]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-bundle
          path: .artifacts/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: vsa-evidence
          path: .artifacts/vsa
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.10'
          registry-url: https://npm.pkg.github.com
      - name: Downloaded artifact integrity
        working-directory: .artifacts/release
        run: sha256sum -c SHA256SUMS
      - name: Reverify provenance and VSA before mirror publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARBALL=$(find .artifacts/release -maxdepth 1 -name 'monyeah777-ninfenz-*.tgz' -print -quit)
          VSA_BUNDLE=$(find .artifacts/vsa -maxdepth 1 -type f \
            ! -name 'verification-summary.json' -print -quit)
          gh attestation verify "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/npm-publish.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type "https://slsa.dev/provenance/v1"
          gh attestation verify "$TARBALL" \
            --bundle "$VSA_BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/npm-publish.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type "https://slsa.dev/verification_summary/v1"
      - name: Publish verified GitHub Packages mirror
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V=$(python3 -c "import json; print(json.load(open('.artifacts/release/release-metadata.json'))['version'])")
          TARBALL=".artifacts/release/monyeah777-ninfenz-$V.tgz"
          REGISTRY=https://npm.pkg.github.com
          EXISTING=$(npm view "@monyeah777/ninfenz@$V" dist.integrity \
            --registry "$REGISTRY" 2>/dev/null || true)
          LOCAL="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          if [ -n "$EXISTING" ]; then
            test "$EXISTING" = "$LOCAL"
            echo "GitHub Packages mirror already exists with identical integrity"
            exit 0
          fi
          printf '@monyeah777:registry=%s\n//npm.pkg.github.com/:_authToken=%s\n' \
            "$REGISTRY" "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/.npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc" \
            npm publish "$TARBALL" --registry "$REGISTRY" --access public --ignore-scripts

  github-release:
    name: publish-attested-github-release
    needs: [build, attest, verify, publish-npm, publish-github-packages]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: release-bundle
          path: .artifacts/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: vsa-evidence
          path: .artifacts/vsa
      - name: Verify release evidence before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARBALL=$(find .artifacts/release -maxdepth 1 -name 'ninfenz-*.tgz' -print -quit)
          VSA_BUNDLE=$(find .artifacts/vsa -maxdepth 1 -type f \
            ! -name 'verification-summary.json' -print -quit)
          gh attestation verify "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/npm-publish.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type "https://slsa.dev/provenance/v1"
          gh attestation verify "$TARBALL" \
            --bundle "$VSA_BUNDLE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/npm-publish.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type "https://slsa.dev/verification_summary/v1"
      - name: Create or complete GitHub Release without overwriting assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
            EXISTING=""
          fi
          CHECK=$(mktemp -d "$RUNNER_TEMP/release-check.XXXXXX")
          for FILE in .artifacts/release/* .artifacts/vsa/*; do
            NAME=$(basename "$FILE")
            if grep -Fxq "$NAME" <<<"$EXISTING"; then
              gh release download "$TAG" --pattern "$NAME" --dir "$CHECK"
              cmp "$FILE" "$CHECK/$NAME"
            else
              gh release upload "$TAG" "$FILE"
            fi
          done
