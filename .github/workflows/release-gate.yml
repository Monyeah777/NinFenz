name: release-gate
# 45 · 打 tag 强制闸：v* 标签推送即跑发布前体检（verify + 基线自描述 + 覆盖率），
# 任一 FAIL → CI 红 → Releases/发布动作受阻（把 nf release check 从“命令”升为“强制”）。
on:
  push:
    tags: ['v*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  gate:
    name: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60          # 挂死上限（2026-10-01 统一）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          # 2026-10-22：发布前体检含全量 discover（p6_evaluations 依赖 git tag/全历史）；浅克隆必红。
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          cache-dependency-path: .github/requirements-*.txt
          cache: pip
          python-version: '3.11'
      - name: 安装测试依赖（verify + 标准对照 + 覆盖率）
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
          pip install --require-hashes -r .github/requirements-ci.txt  # 版本固定见该文件（F-05）
      - name: 发布前体检（verify + 基线自描述一致；日志落盘供失败诊断）
        env:
          NF_VERIFY_TMP: .nf-logs
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/nf.py release 2>&1 | tee release-gate.log
      - name: 端到端显式步（与 nf release 内嵌同源；失败即红，便于定位）
        run: python3 scripts/e2e_desktop_headless.py
      - name: 覆盖率门槛（core ≥80）
        run: |
          coverage run --source=desktop/src/core -m unittest discover -s desktop/tests
          coverage report --fail-under=80 --include="desktop/src/core/*"

      - name: 失败诊断产物（Z5：本 run 的日志/报告；无则跳过）
        # Z5（2026-10-10 审计 §11j N8）：失败时要有**可下载**的诊断物，而不是只留滚动日志。
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: release-gate-diagnostics
          path: |
            .nf-logs/
            .artifacts/
            *.log
          if-no-files-found: ignore
