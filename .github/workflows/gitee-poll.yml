name: gitee-poll
# 📚 云端代收站 · Gitee 前端轮询（Y12′ 扩展 · 2026-09-07 · 零治理开放投稿）
# 背景：投稿写入口原只在 GitHub Issues（国内进不去）；Gitee Issues 国内可达。
# 流程：每 10 分钟醒来 → gitee_ingest.py 拉 Gitee open 投稿（标题【NF投稿】）
#   → 同一入库核心（净化/空壳拒收/36进制编号/小写键查重/ALIAS 重建）
#   → git 提交推双端（gitee 子令牌 + origin）→ Gitee Issue 回评双端链接 → 关闭
# 依赖 Secrets：GITEE_TOKEN（Gitee 子令牌：issues 读写 + 仓库推送权限，作者在
#   Gitee 设置生成——主令牌绝不共享，子令牌泄露可控）
# 工作流口径（最小权限 / 共享写锁 / 无令牌 skip 不假红 / 凭据保留说明 / 工件保留期）由
# desktop/tests/test_gitee_poll_workflow_contract.py 判据守住。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: library-write
  cancel-in-progress: false

# 权限最小化（Scorecard TokenPermissionsID）：顶层只读，写权限下放到 job。
permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20          # 挂死上限（2026-10-01 统一）：轮询入库卡住不许拖到下个周期
    steps:
      # 注意：本 workflow **刻意保留 checkout 的凭据注入**（不关闭）——入库要 `git push`
      # 到 origin（GitHub 端），凭据来自 checkout；Gitee 端另用 GITEE_TOKEN 子令牌。
      # 照抄其它 workflow 的「关闭凭据」写法会让 GitHub 端推送 401。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: 凭据检查（GITEE_TOKEN 未配置 → 本轮跳过并留 notice，不产红）
        # 2026-11-08 盲区收口：本 workflow 每 10 分钟跑一次，而仓库 Secrets 里没有配置
        # GITEE_TOKEN（实测 2026-11-07 run 失败：ERROR Gitee 轮询诊断: category=missing_token）
        # ⇒ 每天 144 次假红，把「真失败」淹掉。无凭据时显式 skip，配置后自动恢复轮询。
        id: guard
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "::notice::GITEE_TOKEN 未配置：本轮跳过（作者在仓库 Secrets 加 Gitee 子令牌后自动恢复）"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Gitee 投稿轮询入库（拉取 → 入库 → 双端推送 → 回评关闭）
        if: steps.guard.outputs.skip != '1'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/gitee_ingest.py

      - name: 失败诊断产物（Z5：本 run 的日志/报告；无则跳过）
        # Z5（2026-10-10 审计 §11j N8）：失败时要有**可下载**的诊断物，而不是只留滚动日志。
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: gitee-poll-diagnostics
          path: |
            .nf-logs/
            .artifacts/
            *.log
          if-no-files-found: ignore
          retention-days: 7    # 轮询诊断：7 天回收（每 10 分钟一轮，工件不能无限堆积）
