name: scorecard
# OpenSSF Scorecard（供应链评分 · 外部标准对接 2026-09-29）
#
# 定位：外部权威评分作为**结果可见面**（不进门禁基线——它依赖 GitHub 平台状态与运行时刻，
# 不满足「静态可复现」）；本仓自身的门禁仍是唯一判据来源。
# 已就绪的信号：固定 action SHA（Pinned-Dependencies）、token 最小权限（Token-Permissions）、
# 无危险工作流（Dangerous-Workflow）、SECURITY.md（Security-Policy）、依赖更新工具（Dependabot）。
# 工作流口径（权限/固定/发布语义/工件保留/摘要可追溯）由
# desktop/tests/test_scorecard_workflow_contract.py 判据守住。
on:
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'      # 每周一 01:30 UTC
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: scorecard
  cancel-in-progress: false

permissions: read-all

jobs:
  analysis:
    name: scorecard-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write     # 上传 SARIF
      id-token: write           # publish_results 需要 OIDC
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: 跑 OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        # 钉的必须是**提交** SHA（tag 解引用后的 commit）：注解 tag 对象的 SHA 会被平台判
        # imposter commit（2026-09-29 run #2 实测）。升级时按 tags API 解引用来换，不要用 tag 名。
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: 留工件（SARIF）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: 上传到代码扫描（Security 页可见）
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with:
          sarif_file: results.sarif

  summary:
    name: scorecard-summary
    needs: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: 下载 SARIF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: scorecard-sarif
          path: scorecard-artifact
      - name: 生成可追溯运行摘要
        # 摘要只记录本次平台运行的事实。不得提交为静态基线，也不得把空结果
        # 解释成“无风险”；发布负责人如需归档，另按 commit/run 留存。
        env:
          NF_SCORECARD_COMMIT: ${{ github.sha }}
          NF_SCORECARD_RUN_ID: ${{ github.run_id }}
          NF_SCORECARD_SERVER: ${{ github.server_url }}
          NF_SCORECARD_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          sarif = Path("scorecard-artifact/results.sarif")
          try:
              runs = json.loads(sarif.read_text(encoding="utf-8")).get("runs", [])
              result_count = sum(len(run.get("results", [])) for run in runs)
          except (OSError, ValueError, TypeError):
              result_count = None
          run_id = os.environ["NF_SCORECARD_RUN_ID"]
          repo = os.environ["NF_SCORECARD_REPOSITORY"]
          doc = {
              "schema": "nf-scorecard-snapshot/1",
              "commit": os.environ["NF_SCORECARD_COMMIT"],
              "run_id": run_id,
              "workflow_url": f"{os.environ['NF_SCORECARD_SERVER']}/{repo}/actions/runs/{run_id}",
              "result_count": result_count,
              "sarif_sha256": hashlib.sha256(sarif.read_bytes()).hexdigest(),
              "empty_results_are_not_clean": True,
          }
          Path("scorecard-summary.json").write_text(
              json.dumps(doc, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: 留工件（可追溯摘要）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: scorecard-summary
          path: scorecard-summary.json
          retention-days: 30
