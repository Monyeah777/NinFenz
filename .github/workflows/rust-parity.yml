name: rust-parity
# Rust 主 crate（`engine/rust/`，只读快线 = 27 条已移植契约的**第三实现面**）的常驻 CI。
#
# 为什么要有它（本仓现状缺口，2026-10-19 只读侦查证实）：
#   ① `cross-lang.yml` 只构建 `engine/rust/canonical`（JCS 独立小包），**主 crate 的单元测试
#      从没进过 CI**——`cargo test --release` 本地能跑、云端不跑，等于"改坏 Rust 判据不红"；
#   ② 主 crate 与 Python 真源的**逐字节对账**（`engine/rust/check_parity.ps1`：receipts / stats /
#      conformance 封缄 + 27 条契约逐条）也没有 workflow 引用——只有作者本机手动跑；
#   ③ 三实现（python / rust canonical / csharp）对同一批 JCS 向量的对拍虽在 `cross-lang.yml`，
#      但那条线不构建主 crate：改 Rust 主 crate 不影响它 ⇒ 归因断裂。
#
# 本工作流的纪律（与 net-engine.yml 同型）：
#   · 只读：不写任何仓库文件；对账产物落 `engine/rust/target/parity`（已 gitignore），不入库；
#   · 失败即红：cargo test / 对拍任一面非 0 一律 exit 非 0，不做 `|| true` 兜底；
#   · 不引第三方 action 以外的依赖：Rust 由 runner 自带（rustup stable），.NET 8 SDK 由镜像自带。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ① 主 crate 单测：`#[cfg(test)]` 构造夹具（asset_contract / asset_density / ... 逐判据负例）。
  #    双平台：这条线的定位就是"第三个独立实现"，只在一个 OS 上绿不算跨平台结论。
  cargo-test:
    name: cargo-test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: 工具链就绪（rustup stable 由 runner 镜像提供）
        shell: bash
        run: |
          cargo --version
          rustc --version
      - name: 主 crate 单测（release 档：与对拍/门禁用的优化档同口径）
        shell: bash
        run: cargo test --release --manifest-path engine/rust/Cargo.toml
      - name: 失败诊断（单测失败时把完整 stdout/stderr 指到 step 摘要）
        if: failure()
        shell: bash
        run: |
          mkdir -p .artifacts
          printf 'cargo test --release 失败：见本 job 的「主 crate 单测」step 原始输出。\n' > .artifacts/rust-cargo-test-failure.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: rust-cargo-test-failure-${{ matrix.os }}
          path: .artifacts/rust-cargo-test-failure.txt
          if-no-files-found: warn

  # ② 三实现 parity 对拍（python / rust canonical / csharp）：`--require-full` ⇒ UNKNOWN=0。
  #    与 cross-lang.yml 的差别：那边是"矩阵线常驻"（主 crate 无关）；这边把 parity 挂在
  #    rust-parity 里，是为了让「Rust 线改坏」在 Rust 自己的 workflow 上就有红灯可归因。
  three-way-parity:
    name: canonical-three-way-parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: 工具链就绪（python3 / rust / .NET 8；镜像自带，不引 setup action）
        shell: bash
        run: |
          python3 --version
          rustc --version
          cargo --version
          dotnet --list-sdks
          dotnet --list-sdks | grep -q '^8\.' || { echo "::error::缺 .NET 8 SDK"; exit 1; }
      - name: 构建两实现（Rust 独立实现 + C# 独立实现；python 侧脚本直接跑）
        shell: bash
        run: |
          cargo build --release --manifest-path engine/rust/canonical/Cargo.toml
          dotnet build engine/dotnet/tools/nf-canonical/nf-canonical.csproj -c Release -v quiet
      - name: 跨语言矩阵 · 正例（full：三实现齐、UNKNOWN=0、逐字节 + digest）
        shell: bash
        run: |
          python3 scripts/cross_lang_verify.py \
            --manifest protocol/generated/test_vectors/jcs_conformance.json \
            --require-full --digest
      - name: 跨语言矩阵 · 负例（拒绝语义三家一致）
        shell: bash
        run: |
          python3 scripts/cross_lang_verify.py \
            --manifest protocol/generated/test_vectors/jcs_reject.json \
            --require-full
      - name: 覆盖棘轮（spec_clause 覆盖只增不减）
        shell: bash
        run: python3 scripts/cross_lang_verify.py --coverage
      - name: 失败证据（矩阵红线时落可下载报告，不入仓）
        if: failure()
        shell: bash
        run: |
          mkdir -p .artifacts
          python3 scripts/cross_lang_verify.py \
            --manifest protocol/generated/test_vectors/jcs_conformance.json \
            --json --digest > .artifacts/cross-lang-report.json || true
          python3 scripts/cross_lang_verify.py \
            --manifest protocol/generated/test_vectors/jcs_reject.json \
            --json >> .artifacts/cross-lang-report.json || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: rust-parity-cross-lang-report
          path: .artifacts/cross-lang-report.json
          if-no-files-found: warn

  # ③ 主 crate ↔ Python 真源逐字节对账（5 个面，失败即红）：
  #    receipts（协议层回执单根）· stats（自述数字实算）· conformance 封缄（27 条契约摘要）·
  #    差分核对（真源摘要 vs 本线重算）· 已移植契约逐条（退出码 == 真源 ok 的映射）。
  #    脚本内部两侧**背靠背实时重算**，不拿在盘旧产物当基准（见脚本头纪律）。
  truth-parity:
    name: rust-vs-python-truth-parity
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-*.txt
      - name: 工具链就绪（python / rust；check_parity 的对账面用 python 真源重算）
        shell: pwsh
        run: |
          python --version
          cargo --version
          rustc --version
      - name: Python 真源依赖（与 Rust 全量 YAML 口径对齐）
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
      - name: 主 crate ↔ Python 真源逐字节对账（5 面）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File engine/rust/check_parity.ps1 -Root $PWD
      - name: 失败证据（对账面 JSON 拷到可上传目录；target/ 是 gitignore 面不入库）
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .artifacts | Out-Null
          Copy-Item engine/rust/target/parity/*.json .artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem engine/rust/target/parity -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Out-File .artifacts/rust-parity-index.txt -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: rust-parity-truth-evidence
          path: .artifacts/
          if-no-files-found: warn
