name: External links (scheduled, non-gate)

# 定位（2026-09-20 作者裁决执行）：外链可达性**不进 verify 基线**（门禁须静态可复现），
# 本工作流把它做成独立任务——每周跑一次（或手动触发），失败即红便于察觉，报告作为工件留存。
# 权限最小化：只读仓库内容；不上传、不写回仓库任何文件（报告走 artifact）。
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'      # 每周一 03:17 UTC（避开整点拥塞）

concurrency:
  group: external-links
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Scan mode (offline, always green)
        run: python scripts/check_external_links.py

      - name: Fetch mode (network; failures turn this job red; 日志落盘)
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python scripts/check_external_links.py --fetch --json \
            --write results/external-links-report.json 2>&1 | tee .artifacts/external-links.log
          cp results/external-links-report.json .artifacts/external-links-report.json

      - name: Upload report（本 run 的新鲜副本；**不**上传受跟踪的 results/ 原件）
        # N1 同类（审计 Z5）：受跟踪文件在失败时可能是**上一次提交的旧结论**。
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: external-links-report
          path: |
            .artifacts/external-links-report.json
            .artifacts/external-links.log
          if-no-files-found: warn
