name: sast-measure
# 一次性测量工作流（task-40 扩 SAST 扫描面用）：在 Linux + Windows 上跑扩展后的
# `sast_check.py --json`，把两平台计数 JSON 留 artifact。**不用于合并**——测量完即删。
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  measure:
    name: measure-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          cache-dependency-path: .github/requirements-*.txt
          cache: pip
          python-version: '3.11'
      - name: 安装固定版本 SAST 工具
        run: |
          pip install --require-hashes -r .github/requirements-sast.txt
          pip install --require-hashes -r .github/requirements-lint.txt
      - name: 扩展面计数（JSON）
        run: python scripts/sast_check.py --json > sast-counts-ext.json || true
      - name: 上传计数
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sast-counts-ext-${{ matrix.os }}
          path: sast-counts-ext.json
          if-no-files-found: ignore
