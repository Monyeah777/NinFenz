name: issue-guard
# FG-01 空 Issue 拦截：issues.opened/edited 触发（**不是**欢迎语）。
#   判定：正文 < 20 有效字符或模板必填项留空（_No response_）→ 评论（给模板入口）→ 关闭。
#   判定脚本 scripts/issue_guard.py 本地可用模拟 payload 干跑；关闭动作由 gh CLI 执行。
on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-guard-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  guard:
    name: close-empty-issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: 判定是否空 Issue
        id: guard
        run: python scripts/issue_guard.py --payload "$GITHUB_EVENT_PATH" \
             --github-output "$GITHUB_OUTPUT"
      - name: 评论模板入口并关闭（维护者本人不拦，避免误关自查帖）
        if: >-
          steps.guard.outputs.action == 'close'
          && github.event.issue.user.login != github.repository_owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ github.event.issue.number }}"
          gh issue comment "$NUM" --body "$(cat <<'EOF'
          这条 Issue 的正文没有足够信息（有效内容少于 20 字符，或模板必填项为空），已自动关闭。

          请按模板重新提交，把「现象 / 期望 / 实得 / 复现步骤」写全：
          - 缺陷：[BUG] 模板（.github/ISSUE_TEMPLATE/bug_report.yml）
          - 功能：[FEAT] 模板（.github/ISSUE_TEMPLATE/feature_request.yml）
          - 安全问题请**不要**开公开 Issue，走 .github/SECURITY.md 的私密通道。

          填好后随时可以 reopen 或重新提交。
          EOF
          )"
          gh issue close "$NUM" --reason "not planned"
