name: repo-health
# MT-01 / MT-02 仓库体检与卫生专项：
#   repo-doctor：17 条规则 6 组，现算基线并留工件（仓库里的基线件在 results/audit/）；
#   hygiene-gate：gitignore 覆盖度 / 未提交虚拟环境 / 仓库体积 三项进 CI，防止回退。
#   上传的只是本 run 现算的 .artifacts/ 副本，**不**上传受跟踪文件（Z5/N1 判据）。
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'      # 每周一 04:30 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-doctor:
    name: repo-doctor-17-rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: 仓库体检（17 条；结果落 .artifacts/ 供下载，仓库基线见 results/audit/）
        run: |
          set -o pipefail
          mkdir -p .artifacts
          python scripts/repo_doctor.py --out .artifacts/repo-doctor-baseline.json \
            2>&1 | tee .artifacts/repo-doctor.log
      - name: 上传体检报告（失败时同样上传）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: repo-doctor-report
          path: |
            .artifacts/repo-doctor-baseline.json
            .artifacts/repo-doctor.log
          if-no-files-found: warn

  hygiene-gate:
    name: hygiene-three-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: gitignore 覆盖度（五类各至少一条路径规则；FX-07 必过位）
        run: python scripts/check_gitignore_coverage.py
      - name: 卫生三项（gitignore 覆盖 / 虚拟环境入库 / 仓库体积）
        run: python scripts/check_repo_hygiene.py
