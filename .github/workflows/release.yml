name: release
# RL-04 / SC-07 / SC-08 / SC-09：tag 触发的发布线。
#   - 产物：npm tarball（CLI 线）
#   - SHA256SUMS + cosign keyless 签名 + build provenance attestation
#   - Release 正文由 GitHub 原生 generate_release_notes（Conventional Commits）草拟，人只校对
on:
  push:
    tags: ['v1.*']
  workflow_dispatch:

concurrency:
  # 写入型工作流共享同一并发组（与 gitee-poll / library-ingest 的 library-write 同组）：
  # 它们都会写仓库/Releases，必须串行，避免并发写同一分支/标签。
  group: library-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20.19.0'
      - name: 构建产物（npm tarball）
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist ./packaging/npm
          ls -l dist
      - name: 生成 SHA256SUMS（coreutils，排序保证可复现）
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tgz | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9  # v3
      - name: cosign keyless 签名（SHA256SUMS）
        run: cosign sign-blob --yes --output-signature dist/SHA256SUMS.sig dist/SHA256SUMS
      - name: build provenance attestation（SHA256SUMS）
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45  # v2
        with:
          subject-path: dist/SHA256SUMS
      - name: 创建 Release（自动生成说明 + 校验和 + 签名）
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true
          files: |
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/*.tgz
