name: release

# 发布闸门（2026-10-29）：把「门禁结论」作为可核验的 Release 制品发布。
#
# 为什么（OpenSSF Scorecard 实测：Signed-Releases = -1「no releases found」、Packaging = -1）：
# 本仓此前只有 npm 发布（不是 GitHub Release），于是"制品是否可核验"这一项在评分里根本不计分。
# 本工作流在打 tag 时：
#   1. 校验仓库自身门禁结论齐备（verification_report / cards / receipts 都在场）；
#   2. 生成 SHA256SUMS；
#   3. 在 reusable workflow 内由平台签发 Build L3 provenance；
#   4. 创建 GitHub Release 并挂上这些制品 —— 任何人都能 `gh attestation verify` 独立校验。
#
# 纪律：只读仓库既有产物，**不**重新计算/改写任何判据（发布不得成为"改结论"的通道）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v2.30.0；必须是已存在的 tag）'
        required: true
concurrency:
  group: release-${{ github.ref }}   # 发布型：固定组、不取消（避免半发布状态）
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: isolated-release-evidence
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-evidence-l3.yml

  publish:
    name: publish-attested-gate-evidence
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # 创建 Release
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: gate-release-bundle
          path: .artifacts/release
      - name: 校验下载工件与 Build L3 provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd .artifacts/release
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          for f in .artifacts/release/*.json .artifacts/release/*.md \
                   .artifacts/release/SHA256SUMS; do
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-evidence-l3.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --predicate-type "https://slsa.dev/provenance/v1"
          done
      - name: 创建 GitHub Release（挂制品）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(printf '门禁结论发布\n\n- 提交：`%s`\n- 判据：`verify.sh --checks-only` 42 条 + 全量测试矩阵\n- 校验：`gh attestation verify <file> --repo %s`\n' \
                  "$GITHUB_SHA" "$GITHUB_REPOSITORY")
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NF 门禁结论 $TAG" \
            --notes "$notes" \
            .artifacts/release/*.json .artifacts/release/*.md .artifacts/release/SHA256SUMS .artifacts/release/provenance.intoto.jsonl
