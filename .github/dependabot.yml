# 供应链固定（渗透收口 2026-09-24）：workflow 里的 action 一律按**提交 SHA** 引用——
# tag 可移动，`@v4` 名义不变而实际代码可被替换，等于把 CI 执行权交给上游标签。
# 固定到 SHA 后行为与当日 `@v4` 逐字一致（SHA 取自 tags API 的当时解析值），
# 由本文件负责把固定值**自动跟进**——固定不等于冻结。
version: 2
updates:
  # ① CI 里的 action 固定值跟进（固定到 SHA 后更必须有自动跟进，否则等于冻结上游安全修复）。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      # 次要/补丁批量成一个 PR——降噪，同时保证安全修复仍能单独进来（major 不分组）。
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # ② CI 工具链版本固定（requirements-*.txt）同样要能跟进，
  #    否则固定会退化成冻结上游安全修复。
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # ③ 已发布 npm 包的依赖面（packaging/npm/package.json）——此前**无覆盖**：
  #    仓库对外发布 ninfenz 包，其 devDependencies 却从不被跟进（工业级供应链要求全覆盖）。
  - package-ecosystem: npm
    directory: /packaging/npm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # ④ Rust engines and fuzz targets.
  - package-ecosystem: cargo
    directory: /engine/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "cargo"
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /engine/rust/pyo3
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "cargo"
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /engine/rust/fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "cargo"
    labels:
      - dependencies
  # ⑤ Container digests are pinned, but must still follow upstream security fixes.
  - package-ecosystem: docker
    directory: /packaging/nfal
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    labels:
      - dependencies
  - package-ecosystem: docker
    directory: /packaging/hf-space
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    labels:
      - dependencies
