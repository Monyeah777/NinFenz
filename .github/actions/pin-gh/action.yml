name: Pin GitHub CLI
description: Install a checksum-pinned GitHub CLI for reliable offline attestation bundle verification.
runs:
  using: composite
  steps:
    - name: Install pinned gh
      shell: bash
      run: |
        set -euo pipefail
        gh_version=2.103.3
        gh_sha256=4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        archive="$RUNNER_TEMP/gh_${gh_version}_linux_amd64.tar.gz"
        curl -fsSL \
          "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_amd64.tar.gz" \
          -o "$archive"
        echo "${gh_sha256}  ${archive}" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/gh-bin"
        tar -xzf "$archive" -C "$RUNNER_TEMP/gh-bin" --strip-components=1
        sudo install -m 0755 "$RUNNER_TEMP/gh-bin/bin/gh" /usr/local/bin/gh
        gh version
