# Gradle / JVM
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 本机死代理 127.0.0.1 不要写进仓库；构建前 source D:/tmp/app-toolchain/env.sh 清空代理
# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true
# 16KB page：不压缩/不 legacy 打包 native lib（见 app/build.gradle.kts packaging）
android.experimental.enableNewResourceShrinker.preciseShrinking=false
